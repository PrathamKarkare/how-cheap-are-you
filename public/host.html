<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Host · How Cheap Are You?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- Setup: only the host sees this, before sharing the screen -->
  <main id="setup" class="wrap" hidden>
    <header class="row spread" style="align-items:flex-end;margin-bottom:24px">
      <div>
        <div class="tag">Host setup</div>
        <h1 class="logo">How <span class="hi">Cheap</span> Are You<span class="q">?</span></h1>
        <p class="tagline">6 rounds plus a bonus round. Highest guess without going over the ceiling wins. Changes save in this browser as you type.</p>
      </div>
    </header>

    <div class="panel row" style="margin-bottom:18px;align-items:flex-end">
      <div style="width:110px">
        <label for="currency">Currency</label>
        <input id="currency" type="text" maxlength="3" value="€">
      </div>
      <p class="muted small" style="flex:1;min-width:220px;margin:0 0 10px">Each round lasts 30 seconds. You can lock guesses early.</p>
      <div class="row" style="margin-bottom:2px">
        <button id="resetBtn" class="btn" type="button">Reset to default items</button>
        <button id="exportBtn" class="btn" type="button">Save game file</button>
        <label class="btn" style="margin:0;color:var(--text);font-size:16px">Load game file<input id="importFile" type="file" accept=".json,application/json" hidden></label>
      </div>
    </div>

    <div id="slots" class="setup-grid"></div>

    <div class="row" style="margin-top:24px;justify-content:flex-end">
      <p id="setupError" class="error" style="flex:1"></p>
      <button id="openLobby" class="btn primary big" type="button">Open the doors 🛒</button>
    </div>
  </main>

  <!-- Live game: this is what you screen-share -->
  <main id="live" class="wrap" hidden>
    <div class="topbar">
      <h1 class="logo">How <span class="hi">Cheap</span> Are You<span class="q">?</span></h1>
      <div class="row">
        <div class="code-box">
          <div class="muted small" id="joinHint">Join at <b id="joinHost"></b></div>
          <div class="code" id="codeSmall"></div>
        </div>
        <button id="endBtn" class="btn danger" type="button" title="End this game">End</button>
      </div>
    </div>
    <div id="screen"></div>
  </main>

  <div id="confetti" class="confetti"></div>

  <script src="/analytics.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/host.js"></script>
</body>
</html>
